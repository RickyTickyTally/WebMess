<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Site Chat</title>
  <style>
    body {
      width: 600px;
      height: 480px;
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: row;
      background-color: #f8f9fa;
      overflow: hidden;
    }
    
    /* Боковая панель */
    #sidebar {
      width: 200px;
      height: 100%;
      background-color: #f1f3f5;
      border-right: 1px solid #dee2e6;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }

    .sidebar-header {
      background-color: #e9ecef;
      color: #495057;
      padding: 12px 16px;
      font-weight: bold;
      font-size: 13px;
      border-bottom: 1px solid #dee2e6;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    #tabs-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .tab-item {
      padding: 12px 16px;
      cursor: pointer;
      border-bottom: 1px solid #e9ecef;
      font-size: 13px;
      color: #495057;
      display: flex;
      flex-direction: column;
      gap: 2px;
      transition: background-color 0.2s, color 0.2s;
    }

    .tab-item:hover {
      background-color: #e9ecef;
    }

    .tab-item.active {
      background-color: #0d6efd;
      color: white;
    }

    .tab-item .tab-title {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tab-item .tab-domain {
      font-size: 11px;
      opacity: 0.75;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Основная область чата */
    #main-area {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .screen {
      display: none;
      flex-direction: column;
      height: 100%;
      box-sizing: border-box;
    }

    /* Экран блокировки */
    #blocked-screen {
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
      color: #dc3545;
    }
    #blocked-screen svg {
      margin-bottom: 16px;
      color: #dc3545;
    }
    #blocked-screen h3 {
      margin: 0 0 8px 0;
      font-size: 18px;
    }
    #blocked-screen p {
      margin: 0;
      font-size: 14px;
      line-height: 1.4;
    }

    /* Экран авторизации */
    #auth-screen {
      justify-content: center;
      padding: 32px;
      text-align: center;
    }
    #auth-screen h3 {
      margin: 0 0 8px 0;
      font-size: 20px;
      color: #212529;
    }
    #auth-screen p {
      font-size: 13px;
      color: #6c757d;
      margin: 0 0 20px 0;
    }
    #auth-screen input {
      padding: 10px;
      margin-bottom: 16px;
      border: 1px solid #ced4da;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    #auth-screen input:focus {
      border-color: #0d6efd;
    }
    #auth-screen button {
      padding: 10px;
      background-color: #0d6efd;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: background-color 0.2s;
    }
    #auth-screen button:hover {
      background-color: #0b5ed7;
    }

    /* Экран чата */
    #chat-screen {
      padding: 0;
    }
    .header {
      background-color: #0d6efd;
      color: white;
      padding: 12px 16px;
      font-weight: bold;
      text-align: center;
      font-size: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    #profile-btn {
      background: none;
      border: none;
      color: white;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s;
    }
    #profile-btn:hover {
      opacity: 0.8;
    }
    #profile-btn svg {
      width: 20px;
      height: 20px;
    }

    .users-list {
      font-size: 12px;
      padding: 6px 16px;
      background-color: #e9ecef;
      color: #495057;
      border-bottom: 1px solid #dee2e6;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      transition: background-color 0.2s;
    }
    .users-list:hover {
      background-color: #dee2e6;
    }
    .avatar-list {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .user-avatar-mini {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background-color: #adb5bd;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: bold;
      border: 1.5px solid white;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
      text-transform: uppercase;
    }
    .user-avatar-mini.more {
      background-color: #0d6efd;
      font-size: 9px;
    }
    .messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      background: #f1f3f5;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .message {
      display: flex;
      flex-direction: column;
      max-width: 75%;
      padding: 8px 12px;
      border-radius: 12px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.08);
      font-size: 13px;
      position: relative;
    }
    
    /* Свои сообщения (слева) */
    .message.self {
      align-self: flex-start;
      background-color: #d9fdd3;
      color: #212529;
      border-bottom-left-radius: 2px;
    }
    
    /* Чужие сообщения (справа) */
    .message.other {
      align-self: flex-end;
      background-color: #ffffff;
      color: #212529;
      border-bottom-right-radius: 2px;
    }

    .message .author {
      font-weight: bold;
      font-size: 11px;
      color: #0d6efd;
      margin-bottom: 3px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    
    .message.self .author {
      color: #157347;
    }

    .message .time {
      font-size: 9px;
      color: #adb5bd;
      align-self: flex-end;
      margin-top: 4px;
    }
    
    .message .text {
      word-break: break-word;
      line-height: 1.4;
    }
    .input-area {
      display: flex;
      padding: 12px;
      background-color: #f8f9fa;
      border-top: 1px solid #dee2e6;
    }
    .input-area input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ced4da;
      border-radius: 6px;
      margin-right: 8px;
      font-size: 14px;
      outline: none;
    }
    .input-area input:focus {
      border-color: #0d6efd;
    }
    .input-area button {
      padding: 10px 16px;
      background-color: #198754;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      transition: background-color 0.2s;
    }
    .input-area button:hover {
      background-color: #157347;
    }

    /* Скайп-заглушка аватара */
    .skype-avatar {
      width: 64px;
      height: 64px;
      background-color: #adb5bd;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      margin: 0 auto 16px auto;
    }
    .skype-avatar svg {
      width: 40px;
      height: 40px;
    }
  </style>
  <!-- Подключение локального Socket.io клиента -->
  <script src="socket.io.min.js"></script>
</head>
<body>

  <!-- Левая панель: Активные вкладки (Чаты) -->
  <div id="sidebar">
    <div class="sidebar-header">Активные чаты</div>
    <div id="tabs-list"></div>
  </div>

  <!-- Правая панель: Основное окно -->
  <div id="main-area">
    <!-- 1. Экран блокировки чувствительных URL -->
    <div id="blocked-screen" class="screen">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
      <h3>Доступ запрещен</h3>
      <p>Чат недоступен на этой странице в целях безопасности.</p>
    </div>

    <!-- 2. Экран авторизации (ввод никнейма) -->
    <div id="auth-screen" class="screen">
      <h3>Добро пожаловать</h3>
      <p>Введите никнейм, чтобы присоединиться к чату этой страницы</p>
      <input type="text" id="nickname-input" placeholder="Ваш никнейм" maxlength="20">
      
      <!-- Премиум настройки -->
      <div style="background: #ffffff; padding: 12px; border: 1px dashed #ced4da; border-radius: 8px; margin-bottom: 16px; text-align: left; box-sizing: border-box;">
        <label style="display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 13px; margin-bottom: 4px; cursor: pointer;">
          <input type="checkbox" id="premium-checkbox">
          Активировать Premium ($3/мес)
        </label>
        
        <div id="premium-options" style="display: none; flex-direction: column; gap: 8px; margin-top: 8px; border-top: 1px solid #f1f3f5; padding-top: 8px;">
          <div style="display: flex; justify-content: space-between; align-items: center; font-size: 12px;">
            <span>Бейдж:</span>
            <select id="premium-badge" style="padding: 4px; border-radius: 4px; border: 1px solid #ced4da; font-size: 12px;">
              <option value="">Без бейджа</option>
              <option value="👑">👑 Создатель</option>
              <option value="🔥">🔥 Профи</option>
              <option value="⚡">⚡ Молния</option>
            </select>
          </div>
          <div style="display: flex; justify-content: space-between; align-items: center; font-size: 12px;">
            <span>Цвет никнейма:</span>
            <select id="premium-color" style="padding: 4px; border-radius: 4px; border: 1px solid #ced4da; font-size: 12px;">
              <option value="">По умолчанию</option>
              <option value="#dc3545">🔴 Красный</option>
              <option value="#6f42c1">🟣 Фиолетовый</option>
              <option value="#fd7e14">🟠 Оранжевый</option>
            </select>
          </div>
          <label style="display: flex; align-items: center; gap: 8px; font-size: 12px; cursor: pointer; margin-top: 4px;">
            <input type="checkbox" id="invisible-checkbox">
            Режим "Невидимка"
          </label>
        </div>
      </div>
      
      <button id="save-nickname-btn">Войти в чат</button>
    </div>

    <!-- 3. Экран чата -->
    <div id="chat-screen" class="screen">
      <div class="header">
        <span id="chat-header-title">Site Chat</span>
        <!-- Кнопка человечка как в скайпе -->
        <button id="profile-btn" title="Профиль">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
        </button>
      </div>
      <div class="users-list" id="users-list-container">
        <span id="users-count-text">В сети: Подключение...</span>
        <div class="avatar-list" id="avatar-list-container"></div>
      </div>
      <div class="messages" id="messages-container"></div>
      <div class="input-area">
        <input type="text" id="message-input" placeholder="Сообщение..." autocomplete="off">
        <button id="send-btn">Отправить</button>
      </div>
    </div>

    <!-- 4. Экран профиля/настроек -->
    <div id="profile-screen" class="screen" style="justify-content: center; padding: 32px; text-align: center;">
      <!-- Скайп-заглушка человечка -->
      <div class="skype-avatar">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
        </svg>
      </div>
      <h3 style="margin: 0 0 16px 0;">Настройки профиля</h3>
      
      <input type="text" id="profile-nickname-input" placeholder="Ваш никнейм" maxlength="20" style="padding: 10px; margin-bottom: 16px; border: 1px solid #ced4da; border-radius: 6px; font-size: 14px; outline: none; transition: border-color 0.2s;">
      
      <!-- Премиум настройки в профиле -->
      <div style="background: #ffffff; padding: 12px; border: 1px dashed #ced4da; border-radius: 8px; margin-bottom: 16px; text-align: left; box-sizing: border-box;">
        <label style="display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 13px; margin-bottom: 4px; cursor: pointer;">
          <input type="checkbox" id="profile-premium-checkbox">
          Активировать Premium ($3/мес)
        </label>
        
        <div id="profile-premium-options" style="display: none; flex-direction: column; gap: 8px; margin-top: 8px; border-top: 1px solid #f1f3f5; padding-top: 8px;">
          <div style="display: flex; justify-content: space-between; align-items: center; font-size: 12px;">
            <span>Бейдж:</span>
            <select id="profile-premium-badge" style="padding: 4px; border-radius: 4px; border: 1px solid #ced4da; font-size: 12px;">
              <option value="">Без бейджа</option>
              <option value="👑">👑 Создатель</option>
              <option value="🔥">🔥 Профи</option>
              <option value="⚡">⚡ Молния</option>
            </select>
          </div>
          <div style="display: flex; justify-content: space-between; align-items: center; font-size: 12px;">
            <span>Цвет никнейма:</span>
            <select id="profile-premium-color" style="padding: 4px; border-radius: 4px; border: 1px solid #ced4da; font-size: 12px;">
              <option value="">По умолчанию</option>
              <option value="#dc3545">🔴 Красный</option>
              <option value="#6f42c1">🟣 Фиолетовый</option>
              <option value="#fd7e14">🟠 Оранжевый</option>
            </select>
          </div>
          <label style="display: flex; align-items: center; gap: 8px; font-size: 12px; cursor: pointer; margin-top: 4px;">
            <input type="checkbox" id="profile-invisible-checkbox">
            Режим "Невидимка"
          </label>
        </div>
      </div>
      
      <div style="display: flex; gap: 8px;">
        <button id="save-profile-btn" style="flex: 1; padding: 10px; background-color: #0d6efd; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600;">Сохранить</button>
        <button id="cancel-profile-btn" style="padding: 10px 16px; background-color: #6c757d; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600;">Отмена</button>
      </div>
    </div>
  </div>

  <!-- Модальное окно участников в сети -->
  <div id="users-modal" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
    <div style="background: white; width: 260px; max-height: 340px; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
      <div style="padding: 14px 16px; background: #e9ecef; border-bottom: 1px solid #dee2e6; font-weight: bold; font-size: 14px; display: flex; justify-content: space-between; align-items: center;">
        <span>В сети</span>
        <button id="close-users-modal-btn" style="background: none; border: none; font-size: 18px; cursor: pointer; font-weight: bold; color: #6c757d; line-height: 1;">&times;</button>
      </div>
      <div id="modal-users-list" style="flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px;">
        <!-- Сюда будем рендерить полный список участников -->
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
