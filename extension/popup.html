<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Site Chat</title>
  <style>
    body {
      width: 600px;
      height: 480px;
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: row;
      background-color: #f8f9fa;
      overflow: hidden;
    }
    
    /* Боковая панель */
    #sidebar {
      width: 200px;
      height: 100%;
      background-color: #f1f3f5;
      border-right: 1px solid #dee2e6;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }

    .sidebar-header {
      background-color: #e9ecef;
      color: #495057;
      padding: 12px 16px;
      font-weight: bold;
      font-size: 13px;
      border-bottom: 1px solid #dee2e6;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    #tabs-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .tab-item {
      padding: 12px 16px;
      cursor: pointer;
      border-bottom: 1px solid #e9ecef;
      font-size: 13px;
      color: #495057;
      display: flex;
      flex-direction: column;
      gap: 2px;
      transition: background-color 0.2s, color 0.2s;
    }

    .tab-item:hover {
      background-color: #e9ecef;
    }

    .tab-item.active {
      background-color: #0d6efd;
      color: white;
    }

    .tab-item .tab-title {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tab-item .tab-domain {
      font-size: 11px;
      opacity: 0.75;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Основная область чата */
    #main-area {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .screen {
      display: none;
      flex-direction: column;
      height: 100%;
      box-sizing: border-box;
    }

    /* Экран блокировки */
    #blocked-screen {
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
      color: #dc3545;
    }
    #blocked-screen svg {
      margin-bottom: 16px;
      color: #dc3545;
    }
    #blocked-screen h3 {
      margin: 0 0 8px 0;
      font-size: 18px;
    }
    #blocked-screen p {
      margin: 0;
      font-size: 14px;
      line-height: 1.4;
    }

    /* Экран авторизации */
    #auth-screen {
      justify-content: center;
      padding: 32px;
      text-align: center;
    }
    #auth-screen h3 {
      margin: 0 0 8px 0;
      font-size: 20px;
      color: #212529;
    }
    #auth-screen p {
      font-size: 13px;
      color: #6c757d;
      margin: 0 0 20px 0;
    }
    #auth-screen input {
      padding: 10px;
      margin-bottom: 16px;
      border: 1px solid #ced4da;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    #auth-screen input:focus {
      border-color: #0d6efd;
    }
    #auth-screen button {
      padding: 10px;
      background-color: #0d6efd;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: background-color 0.2s;
    }
    #auth-screen button:hover {
      background-color: #0b5ed7;
    }

    /* Экран чата */
    #chat-screen {
      padding: 0;
    }
    .header {
      background-color: #0d6efd;
      color: white;
      padding: 12px 16px;
      font-weight: bold;
      text-align: center;
      font-size: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    #profile-btn {
      background: none;
      border: none;
      color: white;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s;
    }
    #profile-btn:hover {
      opacity: 0.8;
    }
    #profile-btn svg {
      width: 20px;
      height: 20px;
    }

    .users-list {
      font-size: 12px;
      padding: 6px 16px;
      background-color: #e9ecef;
      color: #495057;
      border-bottom: 1px solid #dee2e6;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      transition: background-color 0.2s;
    }
    .users-list:hover {
      background-color: #dee2e6;
    }
    .avatar-list {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .user-avatar-mini {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background-color: #adb5bd;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: bold;
      border: 1.5px solid white;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
      text-transform: uppercase;
    }
    .user-avatar-mini.more {
      background-color: #0d6efd;
      font-size: 9px;
    }
    .messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      background: #f1f3f5;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .message {
      display: flex;
      flex-direction: column;
      max-width: 75%;
      padding: 8px 12px;
      border-radius: 12px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.08);
      font-size: 13px;
      position: relative;
    }
    
    /* Свои сообщения (слева) */
    .message.self {
      align-self: flex-start;
      background-color: #d9fdd3;
      color: #212529;
      border-bottom-left-radius: 2px;
    }
    
    /* Чужие сообщения (справа) */
    .message.other {
      align-self: flex-end;
      background-color: #ffffff;
      color: #212529;
      border-bottom-right-radius: 2px;
    }

    .message .author {
      font-weight: bold;
      font-size: 11px;
      color: #0d6efd;
      margin-bottom: 3px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    
    .message.self .author {
      color: #157347;
    }

    .message .time {
      font-size: 9px;
      color: #adb5bd;
      align-self: flex-end;
      margin-top: 4px;
    }
    
    .message .text {
      word-break: break-word;
      line-height: 1.4;
    }
    .input-area {
      display: flex;
      padding: 12px;
      background-color: #f8f9fa;
      border-top: 1px solid #dee2e6;
    }
    .input-area input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ced4da;
      border-radius: 6px;
      margin-right: 8px;
      font-size: 14px;
      outline: none;
    }
    .input-area input:focus {
      border-color: #0d6efd;
    }
    .input-area button {
      padding: 10px 16px;
      background-color: #198754;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      transition: background-color 0.2s;
    }
    .input-area button:hover {
      background-color: #157347;
    }

    /* Скайп-заглушка аватара */
    .skype-avatar {
      width: 64px;
      height: 64px;
      background-color: #adb5bd;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      margin: 0 auto 16px auto;
    }
    .skype-avatar svg {
      width: 40px;
      height: 40px;
    }
    #profile-avatar-wrapper:hover .avatar-hover-overlay {
      opacity: 1 !important;
    }
    /* Кастомный скроллбар для профиля */
    #profile-screen::-webkit-scrollbar {
      width: 4px;
    }
    #profile-screen::-webkit-scrollbar-track {
      background: transparent;
    }
    #profile-screen::-webkit-scrollbar-thumb {
      background: #adb5bd;
      border-radius: 4px;
    }
  </style>
  <!-- Подключение локального Socket.io клиента -->
  <script src="socket.io.min.js"></script>
</head>
<body>

  <!-- Левая панель: Активные вкладки (Чаты) -->
  <div id="sidebar">
    <div class="sidebar-header">Активные чаты</div>
    <div id="tabs-list"></div>
  </div>

  <!-- Правая панель: Основное окно -->
  <div id="main-area">
    <!-- 1. Экран блокировки чувствительных URL -->
    <div id="blocked-screen" class="screen">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
      <h3>Доступ запрещен</h3>
      <p>Чат недоступен на этой странице в целях безопасности.</p>
    </div>

    <!-- 2. Экран авторизации (ввод никнейма) -->
    <div id="auth-screen" class="screen">
      <h3>Добро пожаловать</h3>
      <p>Введите никнейм, чтобы присоединиться к чату этой страницы</p>
      <input type="text" id="nickname-input" placeholder="Ваш никнейм" maxlength="20">
      
      <!-- Премиум настройки -->
      <div style="background: #ffffff; padding: 12px; border: 1px dashed #ced4da; border-radius: 8px; margin-bottom: 16px; text-align: left; box-sizing: border-box;">
        <label style="display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 13px; margin-bottom: 4px; cursor: pointer;">
          <input type="checkbox" id="premium-checkbox">
          Активировать Premium ($3/мес)
        </label>
        
        <div id="premium-options" style="display: none; flex-direction: column; gap: 8px; margin-top: 8px; border-top: 1px solid #f1f3f5; padding-top: 8px;">
          <div style="display: flex; justify-content: space-between; align-items: center; font-size: 12px;">
            <span>Бейдж:</span>
            <select id="premium-badge" style="padding: 4px; border-radius: 4px; border: 1px solid #ced4da; font-size: 12px;">
              <option value="">Без бейджа</option>
              <option value="👑">👑 Создатель</option>
              <option value="🔥">🔥 Профи</option>
              <option value="⚡">⚡ Молния</option>
            </select>
          </div>
          <div style="display: flex; justify-content: space-between; align-items: center; font-size: 12px;">
            <span>Цвет никнейма:</span>
            <select id="premium-color" style="padding: 4px; border-radius: 4px; border: 1px solid #ced4da; font-size: 12px;">
              <option value="">По умолчанию</option>
              <option value="#dc3545">🔴 Красный</option>
              <option value="#6f42c1">🟣 Фиолетовый</option>
              <option value="#fd7e14">🟠 Оранжевый</option>
            </select>
          </div>
          <label style="display: flex; align-items: center; gap: 8px; font-size: 12px; cursor: pointer; margin-top: 4px;">
            <input type="checkbox" id="invisible-checkbox">
            Режим "Невидимка"
          </label>
        </div>
      </div>
      
      <button id="save-nickname-btn">Войти в чат</button>
    </div>

    <!-- 3. Экран чата -->
    <div id="chat-screen" class="screen">
      <div class="header">
        <span id="chat-header-title">Site Chat</span>
        <!-- Кнопка человечка как в скайпе -->
        <button id="profile-btn" title="Профиль">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
        </button>
      </div>
      <div class="users-list" id="users-list-container">
        <span id="users-count-text">В сети: Подключение...</span>
        <div class="avatar-list" id="avatar-list-container"></div>
      </div>
      <div class="messages" id="messages-container"></div>
      <div class="input-area">
        <input type="text" id="message-input" placeholder="Сообщение..." autocomplete="off">
        <button id="send-btn">Отправить</button>
      </div>
    </div>

    <!-- 4. Экран профиля/настроек -->
    <div id="profile-screen" class="screen" style="justify-content: flex-start; padding: 20px 24px; text-align: center; overflow-y: auto;">
      <h3 style="margin: 0 0 16px 0; font-size: 18px; color: #212529;">Настройки профиля</h3>
      
      <!-- Интерактивный аватар -->
      <div id="profile-avatar-wrapper" style="position: relative; width: 72px; height: 72px; margin: 0 auto 16px auto; cursor: pointer; border-radius: 50%; overflow: hidden; border: 2px solid #0d6efd; box-shadow: 0 2px 8px rgba(0,0,0,0.15); flex-shrink: 0;">
        <img id="profile-avatar-preview" style="width: 100%; height: 100%; object-fit: cover; display: none;">
        <div id="profile-avatar-placeholder" style="width: 100%; height: 100%; background-color: #adb5bd; display: flex; justify-content: center; align-items: center; color: white;">
          <svg viewBox="0 0 24 24" fill="currentColor" style="width: 44px; height: 44px;">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
        </div>
        <div style="position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(0, 0, 0, 0.6); color: white; font-size: 9px; padding: 2px 0; text-align: center; font-weight: bold; opacity: 0; transition: opacity 0.2s;" class="avatar-hover-overlay">ИЗМЕНИТЬ</div>
      </div>
      <input type="file" id="profile-avatar-file-input" accept="image/*" style="display: none;">

      <!-- Форма профиля -->
      <div style="width: 100%; display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; text-align: left; box-sizing: border-box;">
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <label style="font-size: 11px; font-weight: bold; color: #495057; text-transform: uppercase; letter-spacing: 0.5px;">Никнейм</label>
          <input type="text" id="profile-nickname-input" placeholder="Ваш никнейм" maxlength="20" style="padding: 8px 12px; border: 1px solid #ced4da; border-radius: 6px; font-size: 13px; outline: none; transition: border-color 0.2s; box-sizing: border-box; width: 100%;">
        </div>
        
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <label style="font-size: 11px; font-weight: bold; color: #495057; text-transform: uppercase; letter-spacing: 0.5px;">Telegram username</label>
          <div style="display: flex; align-items: center; border: 1px solid #ced4da; border-radius: 6px; overflow: hidden; background: white; transition: border-color 0.2s; box-sizing: border-box; width: 100%;">
            <span style="padding: 8px 10px; background: #e9ecef; border-right: 1px solid #ced4da; display: flex; align-items: center; flex-shrink: 0;">
              <svg style="width: 14px; height: 14px; color: #0088cc;" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.02-1.96 1.24-5.54 3.65-.52.36-.97.53-1.34.52-.42-.01-1.21-.24-1.8-.44-.72-.24-1.29-.37-1.24-.78.03-.21.32-.43.89-.65 3.48-1.51 5.8-2.52 6.96-3.01 3.31-1.4 4-.1.4 0z"/>
              </svg>
            </span>
            <input type="text" id="profile-telegram-input" placeholder="@username" style="flex: 1; border: none; padding: 8px 12px; font-size: 13px; outline: none; box-sizing: border-box; width: 100%;">
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 4px;">
          <label style="font-size: 11px; font-weight: bold; color: #495057; text-transform: uppercase; letter-spacing: 0.5px;">Discord username</label>
          <div style="display: flex; align-items: center; border: 1px solid #ced4da; border-radius: 6px; overflow: hidden; background: white; transition: border-color 0.2s; box-sizing: border-box; width: 100%;">
            <span style="padding: 8px 10px; background: #e9ecef; border-right: 1px solid #ced4da; display: flex; align-items: center; flex-shrink: 0;">
              <svg style="width: 14px; height: 14px; color: #5865F2;" viewBox="0 0 24 24" fill="currentColor">
                <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.094 13.094 0 0 1-1.873-.894.077.077 0 0 1-.008-.128c.126-.093.252-.19.372-.287a.075.075 0 0 1 .077-.011c3.92 1.793 8.18 1.793 12.061 0a.073.073 0 0 1 .078.009c.12.099.246.195.373.289a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.894.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.156-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.156 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.156-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.156 2.418z"/>
              </svg>
            </span>
            <input type="text" id="profile-discord-input" placeholder="username" style="flex: 1; border: none; padding: 8px 12px; font-size: 13px; outline: none; box-sizing: border-box; width: 100%;">
          </div>
        </div>
      </div>
      
      <!-- Премиум настройки в профиле -->
      <div style="background: #ffffff; padding: 12px; border: 1px dashed #ced4da; border-radius: 8px; margin-bottom: 16px; text-align: left; box-sizing: border-box; width: 100%;">
        <label style="display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 13px; margin-bottom: 4px; cursor: pointer;">
          <input type="checkbox" id="profile-premium-checkbox">
          Активировать Premium ($3/мес)
        </label>
        
        <div id="profile-premium-options" style="display: none; flex-direction: column; gap: 8px; margin-top: 8px; border-top: 1px solid #f1f3f5; padding-top: 8px;">
          <div style="display: flex; justify-content: space-between; align-items: center; font-size: 12px;">
            <span>Бейдж:</span>
            <select id="profile-premium-badge" style="padding: 4px; border-radius: 4px; border: 1px solid #ced4da; font-size: 12px;">
              <option value="">Без бейджа</option>
              <option value="👑">👑 Создатель</option>
              <option value="🔥">🔥 Профи</option>
              <option value="⚡">⚡ Молния</option>
            </select>
          </div>
          <div style="display: flex; justify-content: space-between; align-items: center; font-size: 12px;">
            <span>Цвет никнейма:</span>
            <select id="profile-premium-color" style="padding: 4px; border-radius: 4px; border: 1px solid #ced4da; font-size: 12px;">
              <option value="">По умолчанию</option>
              <option value="#dc3545">🔴 Красный</option>
              <option value="#6f42c1">🟣 Фиолетовый</option>
              <option value="#fd7e14">🟠 Оранжевый</option>
            </select>
          </div>
          <label style="display: flex; align-items: center; gap: 8px; font-size: 12px; cursor: pointer; margin-top: 4px;">
            <input type="checkbox" id="profile-invisible-checkbox">
            Режим "Невидимка"
          </label>
        </div>
      </div>
      
      <div style="display: flex; gap: 8px; width: 100%; margin-top: auto; flex-shrink: 0; box-sizing: border-box; padding-bottom: 10px;">
        <button id="save-profile-btn" style="flex: 1; padding: 10px; background-color: #0d6efd; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600;">Сохранить</button>
        <button id="cancel-profile-btn" style="padding: 10px 16px; background-color: #6c757d; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600;">Отмена</button>
      </div>
    </div>
  </div>

  <!-- Модальное окно участников в сети -->
  <div id="users-modal" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
    <div style="background: white; width: 260px; max-height: 340px; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
      <div style="padding: 14px 16px; background: #e9ecef; border-bottom: 1px solid #dee2e6; font-weight: bold; font-size: 14px; display: flex; justify-content: space-between; align-items: center;">
        <span>В сети</span>
