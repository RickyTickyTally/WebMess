<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Site Chat</title>
  <style>
    body {
      width: 600px;
      height: 480px;
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: row;
      background-color: #f8f9fa;
      overflow: hidden;
    }
    
    /* Боковая панель */
    #sidebar {
      width: 200px;
      height: 100%;
      background-color: #f1f3f5;
      border-right: 1px solid #dee2e6;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }

    .sidebar-header {
      background-color: #e9ecef;
      color: #495057;
      padding: 12px 16px;
      font-weight: bold;
      font-size: 13px;
      border-bottom: 1px solid #dee2e6;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    #tabs-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .tab-item {
      padding: 12px 16px;
      cursor: pointer;
      border-bottom: 1px solid #e9ecef;
      font-size: 13px;
      color: #495057;
      display: flex;
      flex-direction: column;
      gap: 2px;
      transition: background-color 0.2s, color 0.2s;
    }

    .tab-item:hover {
      background-color: #e9ecef;
    }

    .tab-item.active {
      background-color: #0d6efd;
      color: white;
    }

    .tab-item .tab-title {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tab-item .tab-domain {
      font-size: 11px;
      opacity: 0.75;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Основная область чата */
    #main-area {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .screen {
      display: none;
      flex-direction: column;
      height: 100%;
      box-sizing: border-box;
    }

    /* Экран блокировки */
    #blocked-screen {
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
      color: #dc3545;
    }
    #blocked-screen svg {
      margin-bottom: 16px;
      color: #dc3545;
    }
    #blocked-screen h3 {
      margin: 0 0 8px 0;
      font-size: 18px;
    }
    #blocked-screen p {
      margin: 0;
      font-size: 14px;
      line-height: 1.4;
    }

    /* Экран авторизации */
    #auth-screen {
      justify-content: center;
      padding: 32px;
      text-align: center;
    }
    #auth-screen h3 {
      margin: 0 0 8px 0;
      font-size: 20px;
      color: #212529;
    }
    #auth-screen p {
      font-size: 13px;
      color: #6c757d;
      margin: 0 0 20px 0;
    }
    #auth-screen input {
      padding: 10px;
      margin-bottom: 16px;
      border: 1px solid #ced4da;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    #auth-screen input:focus {
      border-color: #0d6efd;
    }
    #auth-screen button {
      padding: 10px;
      background-color: #0d6efd;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: background-color 0.2s;
    }
    #auth-screen button:hover {
      background-color: #0b5ed7;
    }

    /* Экран чата */
    #chat-screen {
      padding: 0;
    }
    .header {
      background-color: #0d6efd;
      color: white;
      padding: 12px 16px;
      font-weight: bold;
      text-align: center;
      font-size: 15px;
    }
    .users-list {
      font-size: 12px;
      padding: 8px 16px;
      background-color: #e9ecef;
      color: #495057;
      white-space: nowrap;
      overflow-x: auto;
      border-bottom: 1px solid #dee2e6;
    }
    .messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      background: #ffffff;
    }
    .message {
      margin-bottom: 14px;
    }
    .message .author {
      font-weight: bold;
      font-size: 12px;
      color: #0d6efd;
      margin-bottom: 4px;
    }
    .message .time {
      font-size: 10px;
      color: #adb5bd;
      margin-left: 6px;
      font-weight: normal;
    }
    .message .text {
      font-size: 14px;
      color: #212529;
      word-break: break-word;
      line-height: 1.4;
    }
    .input-area {
      display: flex;
      padding: 12px;
      background-color: #f8f9fa;
      border-top: 1px solid #dee2e6;
    }
    .input-area input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ced4da;
      border-radius: 6px;
      margin-right: 8px;
      font-size: 14px;
      outline: none;
    }
    .input-area input:focus {
      border-color: #0d6efd;
    }
    .input-area button {
      padding: 10px 16px;
      background-color: #198754;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      transition: background-color 0.2s;
    }
    .input-area button:hover {
      background-color: #157347;
    }
  </style>
  <!-- Подключение локального Socket.io клиента -->
  <script src="socket.io.min.js"></script>
</head>
<body>

  <!-- Левая панель: Активные вкладки (Чаты) -->
  <div id="sidebar">
    <div class="sidebar-header">Активные чаты</div>
    <div id="tabs-list"></div>
  </div>

  <!-- Правая панель: Основное окно -->
  <div id="main-area">
    <!-- 1. Экран блокировки чувствительных URL -->
    <div id="blocked-screen" class="screen">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
      <h3>Доступ запрещен</h3>
      <p>Чат недоступен на этой странице в целях безопасности.</p>
    </div>

    <!-- 2. Экран авторизации (ввод никнейма) -->
    <div id="auth-screen" class="screen">
      <h3>Добро пожаловать</h3>
      <p>Введите никнейм, чтобы присоединиться к чату этой страницы</p>
      <input type="text" id="nickname-input" placeholder="Ваш никнейм" maxlength="20">
      <button id="save-nickname-btn">Войти в чат</button>
    </div>

    <!-- 3. Экран чата -->
    <div id="chat-screen" class="screen">
      <div class="header" id="chat-header-title">Site Chat</div>
      <div class="users-list" id="users-list">Подключение к сети...</div>
      <div class="messages" id="messages-container"></div>
      <div class="input-area">
        <input type="text" id="message-input" placeholder="Сообщение..." autocomplete="off">
        <button id="send-btn">Отправить</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
